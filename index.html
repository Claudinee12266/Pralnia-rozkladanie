<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pralnia - Rozkładanie</title>
    <style>
        html, body { background: #000; width: 100%; height: 100%; padding: 0; margin: 0; overflow: hidden; }
        #unity-container { width: 100%; height: 100%; position: absolute; }
        #unity-canvas { width: 100%; height: 100%; background: #231f20; }
        #loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; text-align: center; }
        #progress-bar { width: 200px; height: 10px; background: #333; margin-top: 10px; border-radius: 5px; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: #4CAF50; transition: width 0.1s; }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
        <div id="loading-bar">
            Ładowanie gry...
            <div id="progress-bar"><div id="progress-fill"></div></div>
        </div>
    </div>
    <script>
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#loading-bar");
        var progressFill = document.querySelector("#progress-fill");

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/PralniaWeb.loader.js";
        var config = {
            dataUrl: buildUrl + "/PralniaWeb.data.br",
            frameworkUrl: buildUrl + "/PralniaWeb.framework.js.br",
            codeUrl: buildUrl + "/PralniaWeb.wasm.br",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "PralniaGra",
            productVersion: "1.0",
            decompressorUrl: buildUrl + "/PralniaWeb.loader.js"
        };

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressFill.style.width = (100 * progress) + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
            }).catch((message) => {
                alert("Błąd ładowania: " + message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
