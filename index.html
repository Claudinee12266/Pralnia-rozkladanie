<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | PralniaGra</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
 <body style="margin: 0; padding: 0; overflow: hidden; background: #000; width: 100vw; height: 100vh;">
    <div id="unity-container" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0;">
      <canvas id="unity-canvas" tabindex="-1" style="width: 100vw; height: 100vh; max-width: 100%; max-height: 100%; object-fit: contain; background: #231f20; margin: 0; padding: 0; display: block;"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <!-- Ukryta stopka Unity, która spychała grę na Androidzie -->
      <div id="unity-footer" style="display: none;">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">PralniaGra</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        // Funkcja ostrzeżeń (pusta, aby nie blokować ekranu na telefonie)
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/PralniaWeb.loader.js";
      var config = {
        dataUrl: buildUrl + "/PralniaWeb.data.br",
        frameworkUrl: buildUrl + "/PralniaWeb.framework.js.br",
        codeUrl: buildUrl + "/PralniaWeb.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "PralniaGra",
        productVersion: "1.0",
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
